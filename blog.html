<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="柒柒的全部文章：随笔、思考与生活记录，支持标签筛选与年份归档。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="柒柒的个人博客">
  <meta property="og:title" content="博客 - 柒柒的个人博客">
  <meta property="og:description" content="柒柒的全部文章：随笔、思考与生活记录，支持标签筛选与年份归档。">
  <meta property="og:url" content="https://simqiqi.github.io/blog/blog.html">
  <meta property="og:image" content="https://simqiqi.github.io/blog/images/gallery/clouds.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="博客 - 柒柒的个人博客">
  <meta name="twitter:description" content="柒柒的全部文章：随笔、思考与生活记录，支持标签筛选与年份归档。">
  <meta name="twitter:image" content="https://simqiqi.github.io/blog/images/gallery/clouds.jpg">
  <title>博客 - 柒柒的个人博客</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="alternate" type="application/rss+xml" title="柒柒的博客 RSS" href="rss.xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>
  <canvas id="particles"></canvas>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">柒柒<span class="logo-dot">.</span></a>
      <span class="nav-motto" id="navMotto"></span>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="blog.html" class="active">博客</a>
        <a href="gallery.html">光影集</a>
        <a href="review.html">时间胶囊</a>
        <a href="wishes.html">许愿星空</a>
        <a href="guestbook.html">留言墙</a>
        <a href="about.html">关于</a>
        <a href="thanks.html">致谢</a>
        <a href="friends.html">友链</a>
      </div>
      <span class="nav-clock" id="navClock"></span>
      <div class="nav-search">
        <button class="search-toggle" id="searchToggle" aria-label="搜索">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <div class="search-dropdown" id="searchDropdown">
          <input type="text" class="search-input" id="searchInput" placeholder="搜索文章...">
          <div class="search-results" id="searchResults"></div>
        </div>
      </div></div>
  </nav>

  <main class="blog-page">
    <h2>所有文章</h2>
    <p class="blog-subtitle">书写生活的点滴与胡思乱想</p>

    <!-- 站点写作概览 -->
    <div class="blog-overview" id="blogOverview">
      <span class="ov-item"><i class="fa-solid fa-feather-pointed"></i><b id="ovPosts">-</b>篇文章</span>
      <span class="ov-dot"></span>
      <span class="ov-item"><i class="fa-solid fa-tags"></i><b id="ovTags">-</b>个标签</span>
      <span class="ov-dot"></span>
      <span class="ov-item"><i class="fa-solid fa-calendar-days"></i>自<b id="ovSince">-</b>启程</span>
    </div>

    <!-- 标签筛选 -->
    <div class="tag-filter" id="tagFilter"></div>

    <!-- 文章列表（动态渲染） -->
    <div class="post-list" id="postList"></div>
    <p class="empty-tip" id="emptyTip" hidden><i class="fa-regular fa-folder-open"></i> 这个标签下还没有文章~</p>
  </main>

  <!-- ===== 归档时间线 ===== -->
  <section class="archive-section">
    <div class="archive-header">
      <h3>归 档</h3>
      <p class="archive-subtitle">沿时间回望，每一篇都是一枚时间胶囊</p>
    </div>
    <div class="archive-timeline" id="archiveTimeline"></div>
  </section>

  <section class="rss-subscribe" style="max-width:680px;margin:0 auto 60px;padding:0 20px;">
    <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center;">
      <i class="fa-solid fa-rss" style="font-size:28px;color:var(--accent);margin-bottom:10px;display:block;"></i>
      <h3 style="margin-bottom:6px;">订阅博客</h3>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">通过 RSS 阅读器第一时间获取新文章</p>
      <a href="rss.xml" target="_blank" style="display:inline-block;background:var(--accent);color:#fff;padding:8px 24px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;">复制 RSS 链接</a>
      <p style="font-size:11px;color:var(--text-muted);margin-top:10px;">https://simqiqi.github.io/blog/rss.xml</p>
    </div>
  </section>

    <section class="globe-section">
    <div class="globe-label">VISITORS AROUND THE WORLD</div>
    <div class="globe-container" id="globeContainer"></div>
    <div class="globe-visitors" id="globeVisitors">来自世界各地的足迹</div>
  </section>

  <div class="marquee-bar" id="marqueeBar">
    <div class="marquee-track"></div>
  </div>

  <footer>
  <div class="footer-social">
    <a href="https://github.com/Simqiqi" target="_blank" class="ft-github" title="GitHub"><i class="fa-brands fa-github"></i></a>
    <a href="https://weibo.com/u/7878583139" target="_blank" class="ft-weibo" title="微博"><i class="fa-brands fa-weibo"></i></a>
    <a href="https://space.bilibili.com" target="_blank" class="ft-bilibili" title="B站"><i class="fa-brands fa-bilibili"></i></a>
    <a href="mailto:simqiqi@example.com" class="ft-email" title="邮箱"><i class="fa-solid fa-envelope"></i></a>
  </div>
    <p>&copy; 2026 柒柒. Powered by curiosity.</p>
    <p class="footer-stats">本站总访问 <span id="busuanzi_value_site_pv">-</span> 次 · 访客 <span id="busuanzi_value_site_uv">-</span> 人</p>
    <p class="footer-now" data-now hidden></p>
    <div class="runtime" id="siteRuntime"></div>
  </footer>

    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <script src="js/main.js"></script>
  <script src="js/now.js"></script>
  <!-- 博客列表动态渲染 + 标签筛选 + 归档 -->
  <script src="js/blog-list.js"></script>
  <button class="rocket-to-top" id="rocketToTop" aria-label="回到顶部">
    <i class="fa-solid fa-rocket"></i>
  </button>

  <!-- 迷你音乐播放器 -->
  <div class="music-player" id="musicPlayer">
    <button class="music-toggle" id="musicToggle" aria-label="音乐播放器">
      <i class="fa-solid fa-music"></i>
    </button>
    <div class="music-panel" id="musicPanel">
      <div class="track-info">
        <div class="track-name" id="trackName">星空漫步</div>
        <div class="track-mood" id="trackMood">安静 · 治愈</div>
      </div>
      <div class="music-controls">
        <button class="ctrl-btn" id="musicPrev"><i class="fa-solid fa-backward"></i></button>
        <button class="ctrl-btn main-btn" id="musicPlay"><i class="fa-solid fa-play"></i></button>
        <button class="ctrl-btn" id="musicNext"><i class="fa-solid fa-forward"></i></button>
      </div>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="0.5" step="0.01" value="0.15">
    </div>
  </div>

  <button class="back-to-top" id="backToTop" title="回到顶部">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="js/widget.js"></script>

  <script src="js/bgm.js"></script>
</body>
</html>
