  <main class="wishes-page">
    <div class="wishes-header">
      <h2>许 愿 星 空</h2>
      <p class="wishes-subtitle">每一颗星星，都是一句被夜空收留的心愿。划过星星，看看别人的愿望。</p>
    </div>

    <!-- 星空画布 -->
    <div class="wish-sky" id="wishSky">
      <canvas id="wishCanvas"></canvas>

      <!-- 心愿气泡 -->
      <div class="wish-bubble" id="wishBubble" hidden>
        <div class="wb-text" id="wbText"></div>
        <div class="wb-meta" id="wbMeta"></div>
      </div>

      <!-- 放星按钮 -->
      <button class="wish-add-btn" id="wishAddBtn">
        <i class="fa-solid fa-star"></i>
        <span>放一颗星</span>
      </button>

      <p class="wish-hint" id="wishHint"><i class="fa-regular fa-hand-pointer"></i> 划过或点击星星，看看心愿</p>
    </div>

    <p class="wish-note">心愿只保存在你自己的浏览器里——把它当作一个只属于你的小仪式吧。</p>
  </main>

  <!-- 许愿弹窗 -->
  <div class="wish-modal" id="wishModal" aria-hidden="true">
    <div class="wish-modal-card">
      <button class="wish-modal-close" id="wishModalClose" aria-label="关闭">&times;</button>
      <div class="wish-modal-icon"><i class="fa-solid fa-star"></i></div>
      <h3>放一颗星</h3>
      <p class="wish-modal-tip">写下心愿，它会变成夜空中的一颗星。</p>
      <textarea id="wishInput" maxlength="60" placeholder="愿……（60 字以内）"></textarea>
      <input type="text" id="wishName" maxlength="12" placeholder="署名（可留空）">
      <button class="wish-submit" id="wishSubmit"><i class="fa-solid fa-paper-plane"></i> 送它上天</button>
    </div>
  </div>
